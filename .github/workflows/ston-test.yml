
name: Test STON.fi API


on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"


jobs:
  test-ston:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test STON.fi Pool Detection
        run: python ston_bot.py
        
      - name: Save STON.fi detected pools
        run: |
          if [ -f ston_seen.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ston_seen.json
            if ! git diff --cached --quiet; then
              git commit -m "Update detected STON.fi pools"
              git push
            fi
          fi



permissions:
  contents: write

